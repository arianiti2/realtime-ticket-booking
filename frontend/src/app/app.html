<div class="min-h-screen bg-slate-950 text-slate-100">
  <nav class="border-b border-white/10 bg-slate-950/90 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
      <a routerLink="/events" class="flex items-center gap-2 text-lg font-black tracking-tight text-white sm:text-xl">
        <span class="grid size-9 place-items-center rounded-xl bg-indigo-500/15 text-indigo-300">✦</span>
        EventTickets <span class="text-indigo-300">Live</span>
      </a>

      <div class="flex flex-wrap items-center justify-end gap-x-5 gap-y-3 text-sm font-medium text-slate-300">
        <a routerLink="/events" class="transition hover:text-white">Eventet</a>

        @if (auth.currentUser(); as user) {
          @if (user.role === 'CLIENT') {
            <a routerLink="/my-tickets" class="transition hover:text-white">Biletat e mia</a>
          }
          @if (user.role === 'ORGANIZER') {
            <a routerLink="/organizer/create" class="transition hover:text-white">Krijo event</a>
            <a routerLink="/organizer/validate" class="transition hover:text-white">Verifiko biletë</a>
          }
          <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs text-slate-300">
            {{ user.name }} <span class="text-slate-500">· {{ user.role }}</span>
          </span>
          <button (click)="logout()" class="rounded-xl border border-rose-400/20 bg-rose-400/10 px-4 py-2 text-rose-200 transition hover:bg-rose-400/20">
            Dil
          </button>
        } @else {
          <a routerLink="/login" class="transition hover:text-white">Kyçu</a>
          <a routerLink="/register" class="rounded-xl bg-indigo-500 px-4 py-2 text-white shadow-lg shadow-indigo-950/40 transition hover:bg-indigo-400">
            Regjistrohu
          </a>
        }
      </div>
    </div>
  </nav>

  <main class="mx-auto w-full max-w-7xl px-4 py-8 pb-32 sm:px-6 sm:py-10 lg:px-8">
    <router-outlet />
  </main>
</div>
